name: TeamsPlugin
version: '1.1'
main: dev.teams.TeamsPlugin
api-version: '1.21'
description: Player teams with colors, team chat, glow, pvp toggle, team homes and owner crown.
commands:
  team:
    description: Team commands
    usage: /team <create|delete|home|invite|accept|leave|kick|disband|info|pvp|chat>
    aliases: [teams]
  createteam:
    description: Shortcut for /team create
    usage: /createteam <name> <color>
permissions:
  teams.admin:
    description: Lets you disband any team
    default: op
